services:
  arangodb:
    image: arangodb:3.11
    container_name: arangodb-crawler-persistent
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD}
    volumes:
      - crawler-geospace-_arango_data:/var/lib/arangodb3
      - crawler-geospace-_arango_apps:/var/lib/arangodb3-apps

volumes:
  crawler-geospace-_arango_data:
    external: true
  crawler-geospace-_arango_apps:
    external: true